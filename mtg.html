<!DOCTYPE html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<script src="common.js"></script>
	<link rel="stylesheet" href="import.css" />
	<link rel="stylesheet" href="mtg.css" />
	<script src="mtg/third_party/fuse70.min.js"></script>
	<script src="mtg/cards.js"></script>
	<script src="mtg/main.js"></script>
	<script>
		if (document.readyState == "DONE") {
			DOM_ready_wants();
		} else {
			document.addEventListener('DOMContentLoaded', DOM_ready_wants);
		}
	</script>
</head>
<body>
	<div class="ui attached stackable inverted menu">
		<div class="ui container">
			<a href="#deck_segment" class="item">
				<i class="angle down icon"></i>Deck
			</a>
			<a href="#json_segment" class="item">
				<i class="angle down icon"></i>JSON
			</a>
			<div class="ui simple dropdown item">
				<i class="chess icon"></i>
				Commander
				<i class="dropdown icon"></i>
				<div class="menu" id="commander_decks_menu"></div>
			</div>
			<div class="ui simple dropdown item">
				<i class="grid layout icon"></i>
				TODO
				<i class="dropdown icon"></i>
				<div class="menu">
					<div class="item">
						<i class="settings icon"></i>placeholder
					</div>
				</div>
				<!-- is:commander game:paper -->
			</div>
			<div class="ui item">
				<a href="https://scryfall.com/search?q=game%3Apaper+is%3Afirstprint+commander%3Awubrg&unique=cards&as=grid&order=released">
					<i class="database icon"></i>
					Scryfall Commander search
				</a>
			</div>
			<div class="item">
				<!-- <div class="ui input">
					<input type="text" placeholder="TODO filters">
				</div> -->
				<div class="ui action input">
					<input id="search_input" placeholder="..." type="text">
					<button id="search_button" class="ui button">Search</button>
				</div>
				<!-- <form action="http://localhost:8080/query" class="ui form" method="get">
					<div class="ui action input">
						<input name="x" placeholder="First Name" type="text">
						<button class="ui icon button" type="submit">
							<i class="big search icon"></i>
						</button>
					</div>
				</form> -->
			</div>
		</div>
	</div>

	<div class="ui attached stackable menu">
		<div id="deck_subsection_menu" class="ui container"></div>
	</div>

	<div id="main_content" class="ui"></div>

	<div class="ui horizontal divider header"><i class="exchange icon"></i>Sideboard</div>
	<div id="sideboard_content" class="ui"></div>

	<div class="ui horizontal divider header"><i class="cart plus icon"></i>Wants</div>
	<div id="wants_content" class="ui"></div>

	<div class="ui segment">
		<div class="ui labeled input">
			<div class="ui label">Press ENTER to search</div>
			<input type="search" id="card_search_input" placeholder="Card name"/>
		</div>
		<div class="ui toggle checkbox">
			<input type="checkbox" id="card_preview_add_foil_checkbox">
			<label>Foil</label>
		</div>
		</div>
	</div>

	<div class="ui" id="card_search_preview"></div>
	<div class="ui" id="temp_deck_display_content"></div>

	<div class="ui segment" id="json_segment">
		<button class="ui icon button" id="json_fill_button">
			<i class="angle double right icon"></i>
		</button>
		<button class="ui icon button" id="json_select_button">
			<i class="copy icon"></i>
		</button>
		<pre id="json_text"></pre>
	</div>

	<div class="ui segment" id="deck_segment">
		<button class="ui icon button" id="deck_select_button">
			<i class="copy icon"></i>
		</button>
		<pre id="deck_text"></pre>
	</div>
	<div id="message_box" class="card_tag_inner transparent_box opacity-transition">?</div>
</body>
